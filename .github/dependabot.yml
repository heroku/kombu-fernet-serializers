version: 2
  updates:
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
        interval: "cron"
        cronjob: "0 11 * * MON,WED"
      labels:
        - dependencies
        - python
        - edit-on-call
      groups:
        python-minor-patch:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "cron"
        cronjob: "0 11 * * MON,WED"
      labels:
        - dependencies
        - github-actions
        - edit-on-call
      groups:
        actions-minor-patch:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
